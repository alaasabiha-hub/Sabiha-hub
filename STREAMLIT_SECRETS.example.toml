# Copy this structure into Streamlit Cloud > App > Settings > Secrets.
# Do not commit your real secrets.toml file.
[supabase]
url = "https://cujfeqsuanwxobtupxaz.supabase.co"
service_role_key = "YOUR_SUPABASE_SERVICE_ROLE_KEY"

# Optional: enables the owner-only AI business advisor.
# OpenAI API usage is billed separately from a ChatGPT subscription.
[openai]
api_key = "YOUR_OPENAI_API_KEY"
model = "gpt-6-luna"

# Required only until the first owner account is created.
[bootstrap]
owner_setup_token = "GENERATE_A_LONG_RANDOM_ONE_TIME_SETUP_TOKEN"
