name: Validate Streamlit app

on:
  push:
    branches:
      - codex/streamlit-supabase-ai-upgrade
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python files
        run: python -m py_compile sabiha_hub_app.py sabiha_storage.py sabiha_ai.py
      - name: Smoke-test Streamlit startup
        run: |
          streamlit run sabiha_hub_app.py --server.headless true --server.port 8501 > /tmp/sabiha-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sabiha-streamlit.log
          exit 1
# CI validates the current Streamlit app and server-side storage adapter.
